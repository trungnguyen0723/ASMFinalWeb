<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Phone Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/chrome.css" />
  <link rel="stylesheet" href="../styles/pages.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
</head>
<body class="page-sub">
  <header class="topbar" id="topbar"></header>

  <main class="page-shell page-shell--narrow">
    <div class="page-head">
      <h1 class="page-title">Sign in</h1>
      <p class="page-lead">Access your saved devices, preferred brand settings, and Phone Room orders.</p>
    </div>

    <section class="sheet">
      <form id="login-form" class="form-stack" novalidate>
        <div class="field">
          <label for="l-email">Email</label>
          <input class="input" id="l-email" name="email" type="email" autocomplete="email" placeholder="demo@phoneroom.store" required />
        </div>
        <div class="field">
          <label for="l-password">Password</label>
          <div class="pw-row">
            <input class="input" id="l-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
            <button type="button" class="pw-toggle" data-toggle="l-password">Show</button>
          </div>
        </div>
        <div id="login-msg" class="form-msg" role="alert"></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="submit" class="btn-primary">Sign in</button>
          <button type="button" class="btn-outline" id="demo-fill">Use demo member</button>
        </div>
      </form>

      <div class="auth-foot">
        <span>New to Phone Room?</span>
        <a class="text-link" href="register.html">Create an account</a>
      </div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../src/pages/login.js"></script>
</body>
</html>
