<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Phone Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/chrome.css" />
  <link rel="stylesheet" href="../styles/pages.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
</head>
<body class="page-sub">
  <header class="topbar" id="topbar"></header>

  <main class="page-shell page-shell--narrow">
    <div class="page-head">
      <h1 class="page-title">Join Phone Room</h1>
      <p class="page-lead">Create a member account to save flagship comparisons and track warranty orders.</p>
    </div>

    <section class="sheet">
      <form id="register-form" class="form-stack" novalidate>
        <div class="field">
          <label for="r-name">Full name</label>
          <input class="input" id="r-name" name="name" type="text" autocomplete="name" placeholder="Linh Tran" required />
        </div>
        <div class="field">
          <label for="r-email">Email</label>
          <input class="input" id="r-email" name="email" type="email" autocomplete="email" placeholder="linh@phoneroom.store" required />
        </div>
        <div class="field">
          <label for="r-brand">Favorite phone brand</label>
          <select class="select" id="r-brand" name="brandPref">
            <option value="Apple">Apple</option>
            <option value="Samsung">Samsung</option>
            <option value="OPPO">OPPO</option>
            <option value="Xiaomi">Xiaomi</option>
          </select>
        </div>
        <div class="field">
          <label for="r-password">Password</label>
          <div class="pw-row">
            <input class="input" id="r-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required />
            <button type="button" class="pw-toggle" data-toggle="r-password">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="r-confirm">Confirm password</label>
          <input class="input" id="r-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required />
        </div>
        <div id="register-msg" class="form-msg" role="alert"></div>
        <div>
          <button type="submit" class="btn-primary">Create account</button>
        </div>
      </form>

      <div class="auth-foot">
        <span>Already have an account?</span>
        <a class="text-link" href="login.html">Sign in</a>
      </div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../src/pages/register.js"></script>
</body>
</html>
